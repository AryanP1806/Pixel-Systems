<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AlgoPro | Strategy Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="bg-[#020617] text-slate-300 min-h-screen">

    <header class="p-4 border-b border-white/5 flex justify-between items-center bg-[#0f172a] sticky top-0 z-50">
        <h1 class="font-black text-2xl text-blue-500 italic">ALGO<span class="text-white">PRO</span></h1>
        
        <form class="flex gap-4">
            <select name="timeframe" onchange="this.form.submit()" class="bg-slate-900 text-xs border border-slate-700 px-3 py-1.5 rounded outline-none">
                <option value="D" {% if current_tf == 'D' %}selected{% endif %}>Daily</option>
                <option value="60" {% if current_tf == '60' %}selected{% endif %}>1 Hour</option>
                <option value="15" {% if current_tf == '15' %}selected{% endif %}>15 Min</option>
            </select>
            <select name="timeline" onchange="this.form.submit()" class="bg-slate-900 text-xs border border-slate-700 px-3 py-1.5 rounded outline-none">
                <option value="180" {% if current_tl == 180 %}selected{% endif %}>6 Months</option>
                <option value="365" {% if current_tl == 365 %}selected{% endif %}>1 Year</option>
                <option value="730" {% if current_tl == 730 %}selected{% endif %}>2 Years</option>
            </select>
        </form>

        <a href="{% url 'dashboard' %}" class="bg-slate-800 px-4 py-1.5 rounded text-[10px] font-bold uppercase tracking-widest hover:bg-slate-700">Exit</a>
    </header>

    <main class="max-w-[1600px] mx-auto p-6 space-y-6">
        {% if error %}
            <div class="bg-red-500/10 border border-red-500/20 p-10 rounded-2xl text-center text-red-400">
                <h2 class="font-bold text-xl mb-2">Sync Error</h2>
                <p>{{ error }}</p>
            </div>
        {% else %}
            <div class="bg-[#0f172a] border border-white/5 p-4 rounded-3xl">
                <div id="chart"></div>
            </div>
        {% endif %}
    </main>

    <script>
        const candles = {{ candles_json|safe }};
        const sma50 = {{ sma50_json|safe }};
        const sma200 = {{ sma200_json|safe }};
        const buySignals = {{ buy_marks_json|safe }};
        const sellSignals = {{ sell_marks_json|safe }};

        var options = {
            series: [
                { name: 'Candles', type: 'candlestick', data: candles },
                { name: 'SMA 50', type: 'line', data: sma50 },
                { name: 'SMA 200', type: 'line', data: sma200 },
                { name: 'BUY', type: 'scatter', data: buySignals },
                { name: 'SELL', type: 'scatter', data: sellSignals }
            ],
            chart: {
                height: 700,
                type: 'line',
                background: 'transparent',
                toolbar: { show: true },
                animations: { enabled: false }
            },
            colors: ['#3b82f6', '#10b981', '#3b82f6', '#10b981', '#f43f5e'],
            stroke: { width: [1, 2, 2, 0, 0], curve: 'smooth' },
            markers: { 
                size: [0, 0, 0, 10, 10],
                shape: ["circle", "circle", "circle", "triangle", "square"],
                strokeWidth: 0
            },
            xaxis: { type: 'category', labels: { show: false } },
            theme: { mode: 'dark' },
            plotOptions: {
                candlestick: { colors: { upward: '#10b981', downward: '#f43f5e' } }
            },
            tooltip: { shared: true, theme: 'dark' }
        };

        var chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();
    </script>
</body>
</html>
