<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shoonya Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center h-screen font-sans">
    <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 w-96 shadow-2xl">
        <h2 class="text-white text-2xl font-bold mb-2 text-center">Broker Login</h2>
        <p class="text-slate-500 text-xs text-center mb-6 uppercase tracking-widest">Algo Execution Engine</p>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 rounded bg-red-500/10 text-red-400 text-sm border border-red-500/20">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-slate-400 text-xs mb-1 font-semibold">ENTER TOTP / PIN</label>
                <input type="text" name="totp" maxlength="6" autofocus
                    class="w-full bg-black border border-slate-700 text-white p-3 rounded text-center text-2xl tracking-[0.5em] focus:border-blue-500 outline-none"
                    placeholder="000000">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded transition-all">
                CONNECT TO SHOONYA
            </button>
        </form>
    </div>
</body>
</html>
