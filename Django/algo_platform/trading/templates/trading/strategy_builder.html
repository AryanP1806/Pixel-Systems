<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strategy Builder | AlgoLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
        .section-header { border-left: 4px solid #238636; padding-left: 12px; margin-bottom: 20px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
        .form-input { background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; padding: 10px 12px; font-size: 13px; width: 100%; outline: none; transition: border 0.2s; }
        .form-input:focus { border-color: #58a6ff; }
        .btn-primary { background: #238636; color: white; padding: 12px 24px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform 0.1s; }
        .btn-primary:active { transform: scale(0.98); }
        .condition-row { background: #1c2128; border: 1px solid #30363d; padding: 16px; border-radius: 8px; display: flex; gap: 12px; align-items: center; margin-bottom: 12px; position: relative; }
        .logic-bridge { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); background: #30363d; color: #8b949e; font-size: 9px; font-weight: 900; padding: 2px 8px; border-radius: 4px; z-index: 10; }
        select option { background: #161b22; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="h-16 border-b border-[#30363d] flex items-center justify-between px-8 bg-[#161b22] sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <span class="text-blue-500 font-black text-xl italic">ALGO<span class="text-white font-normal">LAB</span></span>
            <div class="flex gap-4 text-sm font-medium">
                <a href="/" class="text-gray-400 hover:text-white">Dashboard</a>
                <a href="/backtest/" class="text-gray-400 hover:text-white">Backtest</a>
                <a href="/strategies/" class="text-blue-400">Strategies</a>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-xs text-gray-500 font-mono">USER: {{ request.session.user_id }}</span>
            <a href="/logout/" class="text-rose-400 text-xs font-bold uppercase hover:text-rose-300">Logout</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-10 px-6">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">Strategy Builder</h1>
                <p class="text-gray-500 text-sm mt-1">Design complex logic without writing a single line of code.</p>
            </div>
            <a href="/strategies/" class="text-sm text-blue-400 hover:underline">← Back to Strategies</a>
        </div>

        <form method="POST" id="strategy-form" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <div class="lg:col-span-4 space-y-6">
                    
                    <section class="card p-6 border-b-4 border-blue-500">
                        <label class="form-label">Strategy Identity</label>
                        <input type="text" name="name" value="{{ strategy.name|default:'' }}" placeholder="e.g. Nifty Scalper v1" class="form-input text-lg font-bold border-none bg-blue-500/5 focus:bg-blue-500/10" required>
                    </section>

                    <section class="card p-6">
                        <div class="section-header"><h2 class="text-xs font-bold text-white uppercase tracking-widest">Asset Details</h2></div>
                        <div class="space-y-4">
                            <div>
                                <label class="form-label text-[10px]">Select Instrument</label>
                                <select name="instrument_select" id="instrument_select" class="form-input" onchange="updateInstrumentMeta()">
                                    <option value="">-- Choose Asset --</option>
                                    <option value="26000" data-symbol="NIFTY 50" data-exch="NSE">NIFTY 50 (NSE)</option>
                                    <option value="26009" data-symbol="NIFTY BANK" data-exch="NSE">NIFTY BANK (NSE)</option>
                                    <option value="7" data-symbol="RELIANCE" data-exch="NSE">RELIANCE (NSE)</option>
                                </select>
                            </div>
                            
                            <input type="hidden" name="symbol" id="hidden_symbol" value="{{ strategy.symbol }}">
                            <input type="hidden" name="exchange" id="hidden_exch" value="{{ strategy.exchange|default:'NSE' }}">
                            <input type="hidden" name="token" id="hidden_token" value="{{ strategy.token }}">

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="form-label text-[10px]">Exchange</label>
                                    <input type="text" id="display_exch" class="form-input opacity-40 cursor-not-allowed" readonly value="NSE">
                                </div>
                                <div>
                                    <label class="form-label text-[10px]">Interval</label>
                                    <select name="interval" class="form-input">
                                        <option value="5">5 Mins</option>
                                        <option value="15">15 Mins</option>
                                        <option value="60">1 Hour</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="card p-6">
                        <div class="section-header"><h2 class="text-xs font-bold text-white uppercase tracking-widest">Risk Management</h2></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="form-label text-[10px]">Stop Loss %</label>
                                <input type="number" name="sl_pct" step="0.1" value="{{ strategy.sl_pct|default:1.0 }}" class="form-input">
                            </div>
                            <div>
                                <label class="form-label text-[10px]">Target %</label>
                                <input type="number" name="target_pct" step="0.1" value="{{ strategy.target_pct|default:2.0 }}" class="form-input">
                            </div>
                        </div>
                    </section>
                </div>

                <div class="lg:col-span-8 space-y-6">
                    
                    <section class="card p-6 border-l-4 border-emerald-500">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold text-white">Entry Conditions</h2>
                            <button type="button" onclick="addCondition('long')" class="text-xs font-bold text-blue-400 bg-blue-400/10 px-3 py-1.5 rounded-full hover:bg-blue-400/20 transition-all">
                                <i class="fas fa-plus mr-1"></i> Add Rule
                            </button>
                        </div>

                        <div id="long-conditions-container" class="space-y-4">
                            <div class="condition-row">
    <div class="flex-1">
        <label class="form-label text-[9px]">Indicator 1</label>
        <select name="long_indicator[]" class="form-input">
            <option value="ema">EMA</option>
            <option value="sma">SMA</option>
            <option value="rsi">RSI</option>
        </select>
    </div>
    <div class="w-20">
        <label class="form-label text-[9px]">Period 1</label>
        <input type="number" name="long_value[]" value="50" class="form-input font-mono">
    </div>

    <div class="flex-1">
        <label class="form-label text-[9px]">Operator</label>
        <select name="long_operator[]" class="form-input text-blue-400 font-bold">
            <option value="crosses_above">Crosses Above</option>
            <option value="greater_than">Greater Than</option>
            <option value="less_than">Less Than</option>
        </select>
    </div>

    <div class="flex-1">
        <label class="form-label text-[9px]">Target Indicator</label>
        <select name="long_target_indicator[]" class="form-input">
            <option value="number">Number (Static)</option>
            <option value="ema">EMA</option>
            <option value="sma">SMA</option>
        </select>
    </div>
    <div class="w-24">
        <label class="form-label text-[9px]">Value/Period 2</label>
        <input type="number" name="long_target_value[]" value="200" class="form-input font-mono">
    </div>

    <button type="button" class="text-rose-500 px-2 mt-4" onclick="this.parentElement.remove()">×</button>
</div>
                        </div>
                    </section>

                    <div class="flex justify-end pt-4">
                        <button type="submit" class="btn-primary shadow-xl shadow-emerald-900/20">
                            <i class="fas fa-rocket mr-2"></i> Save & Deploy Strategy
                        </button>
                    </div>

                </div>
            </div>
        </form>
    </main>

    <script>
        function updateInstrumentMeta() {
            const select = document.getElementById('instrument_select');
            const selected = select.options[select.selectedIndex];
            if (selected.value) {
                document.getElementById('hidden_symbol').value = selected.getAttribute('data-symbol');
                document.getElementById('hidden_exch').value = selected.getAttribute('data-exch');
                document.getElementById('display_exch').value = selected.getAttribute('data-exch');
                document.getElementById('hidden_token').value = selected.value;
            }
        }

        function addCondition(side) {
            const container = document.getElementById(side + '-conditions-container');
            const rows = container.getElementsByClassName('condition-row');
            
            // Clone first row
            const newRow = rows[0].cloneNode(true);
            
            // Clean values
            newRow.querySelectorAll('input').forEach(input => input.value = '0');
            
            // Append
            container.appendChild(newRow);
            updateLogicBridges(container);
        }

        function removeCondition(btn) {
            const container = btn.closest('.space-y-4');
            const rows = container.getElementsByClassName('condition-row');
            if (rows.length > 1) {
                btn.closest('.condition-row').remove();
                updateLogicBridges(container);
            }
        }

        function updateLogicBridges(container) {
            const bridges = container.querySelectorAll('.logic-bridge');
            bridges.forEach((bridge, index) => {
                // Hide bridge on the last item
                if (index === bridges.length - 1) {
                    bridge.style.display = 'none';
                } else {
                    bridge.style.display = 'block';
                }
            });
        }

        // Initialize bridges
        document.addEventListener('DOMContentLoaded', () => {
            updateLogicBridges(document.getElementById('long-conditions-container'));
        });
    </script>
</body>
</html>
