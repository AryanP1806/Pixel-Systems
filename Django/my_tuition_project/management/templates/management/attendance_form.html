{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Attendance & Session Log</h2>
        <span class="badge bg-primary fs-6">{{ batch.name }} (Gr {{ batch.grade }})</span>
    </div>

    <form method="POST" class="card shadow-lg border-0">
        {% csrf_token %}
        <!-- Section 1: Session Details (The Pay part) -->
        <div class="card-header bg-dark text-white p-3">
            <h6 class="mb-0"><i class="bi bi-clock-history me-2"></i>Class Details</h6>
        </div>
        <div class="card-body bg-light border-bottom">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Date</label>
                    <input type="date" name="date" class="form-control form-control-sm" value="{{ date }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Subject</label>
                    <select name="subject" class="form-select form-select-sm" required>
                        {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Duration (Minutes)</label>
                    <select name="duration" class="form-select form-select-sm" required>
                        <option value="30">30 Min</option>
                        <option value="45">45 Min</option>
                        <option value="60" selected>1 Hour</option>
                        <option value="90">1.5 Hours</option>
                        <option value="120">2 Hours</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Topic Covered</label>
                    <input type="text" name="topic" class="form-control form-control-sm" placeholder="e.g. Algebra Intro" required>
                </div>
            </div>
        </div>

        <!-- Section 2: Student List (The Presence part) -->
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light small text-uppercase">
                    <tr>
                        <th class="ps-4">Student Name</th>
                        <th class="text-center">Status</th>
                        <th class="text-end pe-4">Individual Alert</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in batch.students.all %}
                    <tr>
                        <td class="ps-4 fw-bold">{{ s.username }}</td>
                        <td class="text-center">
                            <div class="form-check form-switch d-inline-block">
                                <input class="form-check-input h4 mb-0" type="checkbox" name="attendance" 
                                       value="{{ s.id }}" id="check_{{ s.id }}"
                                       {% if not has_records or s.id in present_ids %}checked{% endif %}>
                            </div>
                        </td>
                        <td class="text-end pe-4">
                            <a id="wa_{{ s.id }}" 
                               href="https://wa.me/91{{ s.parent_phone }}?text=Hello Parent, {{ s.username }} is ABSENT for today's {{ batch.name }} class. Kindly acknowledge.
                               नमस्कार पालक, {{ s.username }} आजच्या {{ batch.name }} वर्गासाठी अनुपस्थित (ABSENT) आहे. कृपया याची नोंद घ्यावी."
                               target="_blank" 
                               class="btn btn-sm btn-outline-success {% if not has_records or s.id in present_ids %}d-none{% endif %}">
                                <i class="bi bi-whatsapp"></i>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="card-footer bg-white text-end py-3">
            <a href="{% url 'batch_detail' batch.id %}" class="btn btn-light border px-4 me-2">Cancel</a>
            <button type="submit" class="btn btn-primary px-5 fw-bold">
                <i class="bi bi-cloud-check me-2"></i>Save Attendance & Session
            </button>
        </div>
    </form>
</div>

<script>
// Auto-hide/show individual WhatsApp buttons
document.querySelectorAll('.form-check-input').forEach(input => {
    input.addEventListener('change', function() {
        const id = this.value;
        const btn = document.getElementById('wa_' + id);
        if (this.checked) btn.classList.add('d-none');
        else btn.classList.remove('d-none');
    });
});
</script>
{% endblock %}
