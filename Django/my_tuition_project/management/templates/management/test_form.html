{% extends 'base.html' %}
{% block content %}

<style>
.form-box {
background: var(--card-bg);
border-radius: 24px;
padding: 40px;
border: 1px solid var(--border-color);
box-shadow: 0 10px 40px rgba(0,0,0,0.05);
}

.input-label {
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
}

.form-control-modern {
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px 16px;
    font-weight: 500;
    transition: 0.2s;
    color: var(--text-main);
}
.form-control-modern:focus {
    border-color: #0d6efd;
    background: var(--card-bg);
    box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
    outline: none;
}


</style>

<div class="container py-2">
<div class="row justify-content-center">
<div class="col-xl-6 col-lg-8">

        <div class="mb-4">
            <a href="{% url 'batch_detail' batch.id %}" class="btn btn-link text-muted text-decoration-none p-0">
                <i class="bi bi-arrow-left me-1"></i> Back to Batch
            </a>
        </div>

        <div class="form-box">
            <div class="text-center mb-5">
                <div class="bg-primary bg-opacity-10 d-inline-flex p-3 rounded-circle mb-3">
                    <i class="bi bi-journal-plus text-primary fs-2"></i>
                </div>
                <h2 class="fw-bold">Schedule New Test</h2>
                <p class="text-muted">Set up an examination for <strong>{{ batch.name }}</strong>.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="input-label">Exam Subject</label>
                    {% if batch.subjects.all %}
                        <select name="subject" class="form-select form-control-modern" required>
                            {% for s in batch.subjects.all %}
                                <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    {% else %}
                        <div class="alert alert-warning rounded-4 border-0 small">
                            <i class="bi bi-exclamation-triangle me-2"></i> No subjects are mapped to this batch yet.
                        </div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label class="input-label">Test Title / Name</label>
                    <input type="text" name="test_name" class="form-control form-control-modern" placeholder="e.g. Unit Test 1" required>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-6">
                        <label class="input-label">Scheduled Date</label>
                        <input type="date" name="date" class="form-control form-control-modern" required value="{{ today }}">
                    </div>
                    <div class="col-md-6">
                        <label class="input-label">Max Marks</label>
                        <input type="number" name="max_marks" class="form-control form-control-modern" placeholder="100" required>
                    </div>
                </div>

                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow" {% if not batch.subjects.all %}disabled{% endif %}>
                        Save & Open Grade Sheet
                    </button>
                    <a href="{% url 'batch_detail' batch.id %}" class="btn btn-outline-secondary rounded-pill py-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>


</div>

{% endblock %}
