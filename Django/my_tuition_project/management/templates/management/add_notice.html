{% extends 'base.html' %}
{% block content %}

<style>
.form-box {
background: var(--card-bg);
border-radius: 24px;
padding: 40px;
border: 1px solid var(--border-color);
box-shadow: 0 10px 40px rgba(0,0,0,0.05);
}
.input-label {
font-size: 0.75rem;
font-weight: 800;
text-transform: uppercase;
color: var(--text-muted);
margin-bottom: 8px;
letter-spacing: 0.5px;
}
.form-control-modern {
background: var(--bg-main);
border: 1px solid var(--border-color);
border-radius: 12px;
padding: 12px 16px;
font-weight: 500;
color: var(--text-main);
}
.form-control-modern:focus {
border-color: #ffc107;
background: var(--card-bg);
box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.1);
outline: none;
}
</style>

<div class="container py-2">
<div class="row justify-content-center">
<div class="col-xl-6 col-lg-8">

        <div class="mb-4">
            <a href="{% url 'dashboard' %}" class="btn btn-link text-muted text-decoration-none p-0">
                <i class="bi bi-arrow-left me-1"></i> Dashboard
            </a>
        </div>

        <div class="form-box">
            <div class="text-center mb-5">
                <div class="bg-warning bg-opacity-10 d-inline-flex p-3 rounded-circle mb-3">
                    <i class="bi bi-megaphone text-warning fs-2"></i>
                </div>
                <h2 class="fw-bold">Global Broadcast</h2>
                <p class="text-muted">Post announcements that appear instantly on all student and faculty dashboards.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="input-label">Headline / Title</label>
                    <input type="text" name="title" class="form-control form-control-modern" placeholder="e.g. Schedule Change or Holiday Notice" required>
                </div>

                <div class="mb-5">
                    <label class="input-label">Announcement Details</label>
                    <textarea name="content" class="form-control form-control-modern" rows="5" placeholder="Provide full details of the notice..." required></textarea>
                </div>

                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-warning btn-lg rounded-pill fw-bold shadow-sm">
                        <i class="bi bi-lightning-charge-fill me-2"></i>Send Broadcast Now
                    </button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-pill py-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>


</div>

{% endblock %}
