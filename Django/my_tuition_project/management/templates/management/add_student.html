{% extends 'base.html' %}

{% block content %}

<div class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4">
<div>
<h2 class="fw-bold text-dark">Enroll New Student</h2>
<p class="text-muted">Fill details or use <a href="#" class="text-primary fw-bold">Bulk CSV Import</a> for speed.</p>
</div>
<a href="{% url 'student_list' %}" class="btn btn-outline-secondary">View All Students</a>
</div>

<form method="POST" class="card shadow-sm border-0">
    {% csrf_token %}
    <div class="card-header bg-primary text-white p-3">
        <h5 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Registration: Student Basics & Fees</h5>
    </div>
    <div class="card-body p-4">
        <!-- Row 1: Credentials -->
        <div class="row mb-4">
            <div class="col-md-4">
                <label class="form-label fw-bold">Name*</label>
                <input type="text" name="username" class="form-control" placeholder="" required autofocus>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Password*</label>
                <input type="password" name="password" class="form-control" value="student123" required>
                <small class="text-muted">Default is set to 'student123'</small>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Optional">
            </div>
        </div>

        <!-- Row 2: Personal Stats -->
        <h6 class="text-primary border-bottom pb-2 mb-3">Personal Details</h6>
        <div class="row mb-4">
            <div class="col-md-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="col-md-3">
    <label class="form-label fw-bold">Current Standard / Grade*</label>
    <select name="grade" class="form-select border-primary" required>
        <option value="" selected disabled>Select Standard</option>
        <option value="9">9th Standard</option>
        <option value="10">10th Standard</option>
        <option value="11">11th Standard</option>
        <option value="12">12th Standard</option>
        <option value="13">Repeaters / Droppers</option>
    </select>
</div>
<div class="col-md-3">
                <label class="form-label">Last Year Marks (%)</label>
                <input type="number" step="0.01" name="marks" class="form-control">
            </div>
        </div>

        <!-- Row 3: Contacts -->
        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label fw-bold">Student Mobile</label>
                <input type="text" name="phone" class="form-control" placeholder="10-digit mobile">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Parent Mobile</label>
                <input type="text" name="parent_phone" class="form-control" placeholder="Critical for alerts">
            </div>
        </div>

        <!-- Row 4: Initial Fees Setup -->
        <h6 class="text-success border-bottom pb-2 mb-3">Fee Configuration</h6>
        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label fw-bold text-success">Total Annual Fees (₹)</label>
                <input type="number" name="total_fees" class="form-control border-success" value="15000">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Fee Due Date</label>
                <input type="date" name="due_date" class="form-control" id="today_date">
            </div>
        </div>

        <div class="bg-light p-3 rounded d-flex justify-content-between align-items-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="add_another" id="addAnother" checked>
                <label class="form-check-label fw-bold" for="addAnother">
                    Immediately add another student after saving
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg px-5">
                <i class="bi bi-save me-2"></i> Register Student
            </button>
        </div>
    </div>
</form>


</div>

<script>
// Set default due date to today for convenience
document.getElementById('today_date').valueAsDate = new Date();
</script>

{% endblock %}
