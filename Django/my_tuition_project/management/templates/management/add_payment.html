{% extends 'base.html' %}
{% block content %}
<h3>Record Payment for {{ fee.description }}</h3>
<div class="alert alert-info">Remaining Balance: ₹{{ fee.balance_due }}</div>

<form method="POST" class="col-md-6">
    {% csrf_token %}
    <div class="mb-3">
        <label>Amount to Pay (₹)</label>
        <input type="number" step="0.01" name="amount_paid" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Note (UPI ID / Cash)</label>
        <input type="text" name="note" class="form-control">
    </div>
    <button type="submit" class="btn btn-success">Update Ledger</button>
</form>
{% endblock %}
